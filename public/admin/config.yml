# Sveltia CMS — édite directement les fichiers de content/ via l'API GitHub.
# Connexion : « Sign In with Token » avec un PAT fine-grained limité à ce dépôt.
# Aucun backend, aucun worker : le jeton ne vit que dans le navigateur.

backend:
  name: github
  repo: corysam/corysam.github.io
  branch: main

# Par défaut, les médias vont dans public/ (servis à la racine : /fichier).
# Les collections projects et experiments surchargent vers public/projects/.
media_folder: public
public_folder: /

# Site bilingue : le français est la langue par défaut et garde les fichiers
# sans suffixe (makidoo.md, profile.json) ; l'anglais vit dans un jumeau suffixé
# (makidoo.en.md, profile.en.json). Les champs sans `i18n` (ordre, couleurs,
# images, positions…) ne s'éditent qu'en français : lib/content.ts les lit
# toujours dans le fichier français, et un texte non traduit retombe sur le
# français.
i18n:
  structure: multiple_files
  locales: [fr, en]
  default_locale: fr
  omit_default_locale_from_file_path: true

collections:
  - name: projects
    label: Projets
    label_singular: Projet
    folder: content/projects
    media_folder: /public/projects
    public_folder: /projects
    extension: md
    create: true
    i18n: true
    # Le nom de fichier est l'`id` que dérive lib/content.ts.
    identifier_field: name
    slug: "{{slug}}"
    fields:
      - { name: name, label: Nom, widget: string, i18n: true }
      - name: status
        label: Statut
        widget: select
        required: false
        options: ["Delivered", "In development"]
      - { name: role, label: Rôle, widget: string, required: false, i18n: true }
      - { name: order, label: Ordre d'affichage, widget: number, value_type: int, default: 999 }
      - { name: description, label: Description courte, widget: text, required: false, i18n: true }
      - { name: mission, label: Mission, widget: text, required: false, i18n: true }
      - { name: problem, label: Problème, widget: text, required: false, i18n: true }
      - { name: method, label: Méthode, widget: text, required: false, i18n: true }
      - { name: result, label: Résultat, widget: text, required: false, i18n: true }
      - name: links
        label: Liens
        widget: list
        required: false
        i18n: true
        fields:
          - { name: label, label: Libellé, widget: string, i18n: true }
          - { name: href, label: URL, widget: string, i18n: duplicate }
      - name: images
        label: Images
        widget: list
        required: false
        field: { name: image, label: Image, widget: image }

  - name: experiments
    label: Expériences
    label_singular: Expérience
    folder: content/experiments
    media_folder: /public/projects
    public_folder: /projects
    extension: md
    create: true
    i18n: true
    # Le nom de fichier est l'`id` que dérive lib/content.ts — et l'identifiant
    # utilisé par les liaisons du Laboratory.
    identifier_field: name
    slug: "{{slug}}"
    fields:
      - { name: name, label: Nom, widget: string, i18n: true }
      - name: label
        label: "Texte de la bulle (défaut : le nom)"
        widget: string
        required: false
        i18n: true
      - { name: category, label: Catégorie, widget: string, required: false, i18n: true }
      - name: accent
        label: Couleur de la bulle
        widget: select
        options: [green, cyan, yellow, red, violet]
        default: violet
      # Vide = placement automatique selon les liaisons et la catégorie
      # (lib/layout.ts). Renseignées, elles épinglent la bulle à cet endroit.
      - { name: x, label: "Position X (%) — vide = automatique", widget: number, value_type: int, required: false }
      - { name: y, label: "Position Y (%) — vide = automatique", widget: number, value_type: int, required: false }
      - { name: order, label: Ordre d'affichage, widget: number, value_type: int, default: 999 }
      - name: status
        label: Statut
        widget: select
        required: false
        options: ["Prototype", "Ongoing", "Paused", "Abandoned"]
      - { name: year, label: Année, widget: string, required: false }
      - { name: description, label: Description courte, widget: text, required: false, i18n: true }
      - { name: idea, label: L'idée de départ, widget: text, required: false, i18n: true }
      - { name: learnings, label: Ce que ça m'a appris, widget: text, required: false, i18n: true }
      - { name: nextSteps, label: Ce qu'il resterait à faire, widget: text, required: false, i18n: true }
      - name: tech
        label: Technologies
        widget: list
        required: false
        field: { name: item, label: Technologie, widget: string }
      - name: links
        label: Liens
        widget: list
        required: false
        i18n: true
        fields:
          - { name: label, label: Libellé, widget: string, i18n: true }
          - { name: href, label: URL, widget: string, i18n: duplicate }
      - name: images
        label: Images
        widget: list
        required: false
        field: { name: image, label: Image, widget: image }

  - name: site
    label: Contenu du site
    i18n: true
    files:
      - name: profile
        label: Profil
        file: content/profile.{{locale}}.json
        i18n: true
        fields:
          - { name: name, label: Nom, widget: string }
          - { name: tagline, label: Accroche, widget: text, i18n: true }
          - { name: email, label: E-mail, widget: string }
          - { name: phone, label: Téléphone, widget: string }
          - { name: linkedin, label: LinkedIn, widget: string }
          - name: resume
            label: CV (PDF, déposé dans public/)
            widget: file
            required: false
          - name: photo
            label: Photo « À propos » (déposée dans public/, format portrait 4:5 idéal)
            widget: image
            required: false
          - name: about
            label: Paragraphes « À propos »
            widget: list
            i18n: true
            field: { name: paragraph, label: Paragraphe, widget: text }
          - name: expertises
            label: Expertises
            widget: list
            i18n: true
            field: { name: item, label: Expertise, widget: string }

      - name: stack
        label: Stack
        file: content/stack.{{locale}}.json
        i18n: true
        fields:
          # Les catégories sont rapprochées par rang : ajouter, retirer ou
          # réordonner une catégorie se fait en français.
          - name: rows
            label: Catégories
            widget: list
            i18n: true
            fields:
              - { name: label, label: Catégorie, widget: string, i18n: true }
              - name: accent
                label: Couleur
                widget: select
                options: [green, cyan, yellow, red, violet]
                i18n: duplicate
              - name: items
                label: Technologies
                widget: list
                i18n: true
                field: { name: item, label: Technologie, widget: string }

      - name: recommendations
        label: Recommandations
        file: content/recommendations.{{locale}}.json
        i18n: true
        fields:
          # Les témoignages sont rapprochés par identifiant : nom et plateforme
          # restent ceux du français, seuls le rôle et le texte se traduisent.
          - name: items
            label: Témoignages
            widget: list
            i18n: true
            fields:
              - { name: id, label: Identifiant, widget: string, i18n: duplicate }
              - name: source
                label: Plateforme d'origine
                widget: select
                default: linkedin
                i18n: duplicate
                options:
                  - { label: LinkedIn, value: linkedin }
                  - { label: Malt, value: malt }
              - { name: name, label: Nom, widget: string, i18n: duplicate }
              - { name: role, label: Rôle, widget: string, i18n: true }
              - { name: text, label: Texte, widget: text, i18n: true }

      - name: lab
        label: Laboratory (liaisons)
        file: content/lab.json
        fields:
          # Les bulles vivent maintenant dans la collection « Expériences » :
          # ce fichier ne garde que les traits qui les relient.
          - name: edges
            label: Liaisons entre expériences
            widget: list
            required: false
            fields:
              - name: from
                label: De
                widget: relation
                collection: experiments
                search_fields: [name]
                display_fields: [name]
                value_field: "{{slug}}"
              - name: to
                label: Vers
                widget: relation
                collection: experiments
                search_fields: [name]
                display_fields: [name]
                value_field: "{{slug}}"
